<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Get in touch with White Water Rafting Adventures for bookings, inquiries, and trip info. We’re ready to help you plan an unforgettable rafting experience.">
    <meta name="author" content="Austine Essien">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>White Water Rafting: Contact us</title>
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="container">

            <h1>White Water Rafting Company</h1>
            <p class="contact-info">
                123 Main River Street <br>
                Kolob, California <br>
                +1 999 999 9999 <br>
                info@whitewater.com
            </p>

            <div class="content-wrapper">

                <!-- Map Placeholder -->
                <div class="map-box">
                    <div class="map-placeholder">
                        <iframe class="iframe"
                            src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3232657.556080127!2d-119.36289798363799!3d37.69873196271808!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1764266555371!5m2!1sen!2sng"
                            width="600" height="450" allowfullscreen="" loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </div>
                <!-- Contact Form -->
                <form class="contact-form">
                    <!-- Name -->
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>

                    <!-- Email -->
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <!-- Message Purpose -->
                    <fieldset>
                        <legend>Message Purpose</legend>

                        <label for="purpose-general">
                            <input type="radio" id="purpose-general" name="purpose" value="general" checked>
                            General Inquiry
                        </label>

                        <label for="purpose-reservation">
                            <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label for="purpose-website">
                            <input type="radio" id="purpose-website" name="purpose" value="website">
                            Website Suggestion
                        </label>
                    </fieldset>

                    <!-- Message -->
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Type your message here..."
                        required></textarea>

                    <!-- Newsletter Checkbox -->
                    <label class="checkbox" for="subscribe">
                        <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                        Subscribe me to the monthly newsletter
                    </label>

                    <!-- Submit button -->
                    <button type="submit">Get in Touch!</button>
                </form>


            </div>
        </div>
        <div class="team-section">
            <h2>We Are Here to Serve You</h2>

            <div class="profile-container">

                <div class="profile-card">
                    <div class="profile-img">
                        <img src="images/picture001.jpg" alt="Employee Photo">
                    </div>
                    <p>Employee Profile</p>
                </div>

                <div class="profile-card">
                    <div class="profile-img">
                        <img src="images/picture002.jpg" alt="Employee Photo">
                    </div>
                    <p>Employee Profile</p>
                </div>

                <div class="profile-card">
                    <div class="profile-img">
                        <img src="images/picture003.jpg" alt="Employee Photo">
                    </div>
                    <p>Employee Profile</p>
                </div>
            </div>

        </div>
    </main>
    <footer>
        <p> &copy; 2025 White Water Rafting | Austine Essien</p>
        <nav class="socialmedia ">
            <a href="https://www.facebook.com"><img src="images/facebook.png" alt="facebook Icon"></a>
            <a href="https://www.instagram.com"><img src="images/instagram.png" alt="instagram icon"></a>
            <a href="http://www.linkedin.com"><img src="images/linkedin.png" alt="LinkedIn Icon">
        </nav>
    </footer>

</body>

</html>
